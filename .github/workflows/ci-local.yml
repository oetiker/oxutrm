name: CI (oxutrm)

# oxutrm's own CI jobs, called from ci.yml. No other trigger: a push or
# pull_request trigger here would run every job twice.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to test; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV 1.96
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The floor is not decoration: declaring a version in Cargo.toml and
      # never testing it is how it quietly rises. It rose here -- `rcgen`
      # pulls `time`, which now needs 1.88 -- and this job is what noticed.
      # Keep this number and `workspace.package.rust-version` in step.
      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@1.96

      - name: Cargo check
        run: cargo check --workspace --all-targets
