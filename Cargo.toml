[workspace]
resolver = "3"
members = [
    "crates/oxutrm-proto",
    "crates/oxutrm-sync",
    "crates/oxutrm-term",
    "crates/oxutrm-net",
    "crates/oxutrm-host",
    "crates/oxutrm-client",
]

[workspace.package]
edition = "2024"
# The floor was 1.85 -- alacritty_terminal 0.26's own MSRV -- and the
# dependency tree walked past it: `rcgen` pulls `time` 0.3.55, which needs
# 1.88, so the CI job that checks this failed on a version nothing could build
# any more. Rather than pin `time` back and fight the same battle every few
# months, the floor moves up.
#
# 1.96 and not the newest stable (1.98 at the time of writing, which is what
# the other CI jobs use) because it is the toolchain oxutrm is developed on:
# declaring a version the maintainer's own `cargo build` would refuse buys
# nothing. It is high enough for every dependency now in the lock, and high
# enough for `ruzstd` 0.9 (1.87) whenever that is wanted.
rust-version = "1.96"
license = "Apache-2.0"

# Declared once here, used by every member. Versions come from the interface
# contract's dependency table, which is normative:
#   docs/superpowers/plans/2026-08-25-oxutrm-contract.md
#
# `rustls` deliberately has NO entry: the contract pins it to "whatever quinn
# 0.11 re-exports", so oxutrm-net reaches it as `quinn::rustls` rather than
# declaring a version that could drift out of step with quinn's.
[workspace.dependencies]
quinn = "0.11"
rcgen = "0.13"
alacritty_terminal = { version = "0.26", default-features = false }
rustix = { version = "1", features = ["process", "termios", "stdio", "fs"] }
rustix-openpty = "0.2"
stun_codec = "0.4"
stunclient = "0.4"
bytecodec = "0.5"
crab_nat = "0.8"
igd-next = "0.17"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "macros",
    "io-util",
    "sync",
    "process",
    # SIGWINCH, for the client's event loop. `process` does NOT imply this:
    # both pull in `signal-hook-registry`, which is what makes the omission
    # look harmless, but only `signal` builds `tokio::signal`. Without it the
    # client would be back to asking the terminal its size 250 times a second
    # for an answer that changes twice a day.
    "signal",
    # The host's signalling channel IS descriptors 0 and 1 -- ssh's pipes --
    # so `host --serve` reads and writes its handshake on stdin and stdout
    # asynchronously. `io-util` gives the traits; only `io-std` gives the two
    # handles that implement them for the real descriptors.
    "io-std",
] }
postcard = { version = "1", features = ["use-std"] }
# `rc` for the `Arc<str>` in `ClipboardCopy`: the sender's ring of states
# shares one copy of the text instead of cloning it 32 times.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# 0.9 needs rustc 1.87 and is now within the floor; the pin stays at 0.8 until
# somebody has a reason to move it, not because it is blocked.
ruzstd = "0.8"
# The `serde` feature is required: `Attrs` derives Serialize/Deserialize
# inside the bitflags! macro, which needs the generated internal type to
# implement them.
bitflags = { version = "2", features = ["serde"] }
anyhow = "1"
thiserror = "2"
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
sha1 = "0.10"
netdev = "0.46"
base64 = "0.22"
unicode-width = "0.2"
# `serde` so `CellText` round-trips as a plain str, byte-identical to what a
# `String` would produce - which is what makes the alias swappable.
compact_str = { version = "0.10", features = ["serde"] }
proptest = "1"
# `std` alone. `all-widgets` and `layout-cache` were here and were not used:
# layer 1 draws with `Block` and `Paragraph`, which `std` already provides,
# and nothing calls `Layout::split`, which is the only thing the cache caches.
# Measured rather than assumed: dropping both takes exactly one crate --
# `critical-section`, which `layout-cache` needs -- out of the graph. The point
# is not the crate count but that two feature flags no longer claim the client
# uses machinery it does not.
ratatui = { version = "0.30", default-features = false, features = ["std"] }
# The status popup's log shows local wall-clock times. std has no time zone
# and the root crate forbids `unsafe`, so the zone is read through jiff:
# `tz-system` finds it (TZ, /etc/localtime), `tzdb-zoneinfo` resolves its
# name against the system's database. client.log stays UTC and needs none of
# this.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
insta = "1"
# The client's config file (src/config.rs): read and, from the config screen,
# written back with every comment and key it did not change kept as written.
# Default features only -- `parse` and `display`; no serde: each key is read
# and checked on its own, so one bad value costs only that key.
toml_edit = "0.25"

# Not in the contract's table; required by the M4 integration plan and declared
# here so its tasks do not each re-pin them.
bytes = "1"
libc = "0.2"

oxutrm-proto = { path = "crates/oxutrm-proto" }
oxutrm-sync = { path = "crates/oxutrm-sync" }
oxutrm-term = { path = "crates/oxutrm-term" }
oxutrm-net = { path = "crates/oxutrm-net" }
oxutrm-host = { path = "crates/oxutrm-host" }
oxutrm-client = { path = "crates/oxutrm-client" }

[package]
name = "oxutrm"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A remote terminal that survives bad networks, changing IP addresses, and NAT on both ends"

# ---------------------------------------------------------------------------
# Packaging
# ---------------------------------------------------------------------------
#
# The release builds archives for Linux (x86_64 and aarch64) and macOS (Intel
# and Apple silicon), .deb and .rpm packages from the Linux archives
# (nfpm.yaml), and a Homebrew bottle (Formula/oxutrm.rb). The callers are in
# .github/workflows/release-build.yml.
#
# Windows is not possible: oxutrm needs a pty, `fork`, `setsid` and the
# session's Unix socket. macOS is a published platform; the owner runs oxutrm
# on a Mac every day. illumos does not build yet: the netdev crate does not
# compile for it, rustix-openpty has no `login_tty` there, and
# oxutrm-host's `boot_token` has no illumos reader.
#
# The Linux archives are **static musl**, and that is not a preference. The
# host half is copied to whatever machine the user sshes into, and a binary
# linked against the builder's glibc does not run on an older one -- measured on
# 2026-08-28, when a build needing GLIBC_2.39 would not load on an Ubuntu 22.04
# host at 2.35, for the sake of two symbols. A static binary has no such
# argument with its destination.

[[bin]]
name = "oxutrm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
oxutrm-proto.workspace = true
oxutrm-sync.workspace = true
oxutrm-term.workspace = true
oxutrm-net.workspace = true
oxutrm-host.workspace = true
oxutrm-client.workspace = true
# `fs` and `event` are for the keyboard: it is opened as its own file
# description on the controlling terminal rather than by making fd 0
# non-blocking, because fd 0's description belongs to the user's shell. `pty`
# is used only by the tests, which need a real terminal to observe that.
# The terminal itself belongs to oxutrm-client's RawGuard.
# `time` is for one test only, and it is load-bearing: the ladder's
# closed-update-channel guard has to measure CPU, not wall clock. A select that
# spins on a ready-but-empty channel still finishes on schedule -- it just eats
# a core doing it -- so an elapsed-time assertion cannot see the bug at all.
# Measured, not theorised: the naive wall-clock version passed against a
# deliberately reintroduced spin.
rustix = { workspace = true, features = ["event", "pty", "time"] }
# src/link.rs adapts a Frame onto a QUIC connection - datagram if it fits, a
# fresh unidirectional stream if not. It lives here rather than in oxutrm-net
# because it is transport POLICY for the session loops, not connectivity, and
# because oxutrm-net has no business knowing what a Frame is.
quinn.workspace = true
jiff.workspace = true
toml_edit.workspace = true
# src/preview.rs measures a received preview's cells: one wider than a
# wide glyph would push the selector's border out.
unicode-width.workspace = true

[dev-dependencies]
# `test-util` for `#[tokio::test(start_paused = true)]`, which src/accept.rs
# needs: the accept deadline is measured in tens of seconds and a test that
# waited for it in wall clock would be the slowest thing in the gate. Paused
# time makes the clock jump to the next deadline whenever the runtime has
# nothing to run, so the assertion is on the SAME const the code uses and costs
# no seconds. Under resolver 3 a dev-dependency feature is not unified into the
# normal build, so `test-util` never reaches the shipped binary.
tokio = { workspace = true, features = ["test-util"] }
# The loopback test replays the ANSI the renderer emitted through a real
# emulator and compares it with the host's screen. That is a stronger claim
# than "the two states match", which the sync tests already prove.
alacritty_terminal.workspace = true
# src/listener.rs registers a `RegistryGuard` under a scratch directory rather
# than the real registry root, so its tests cannot collide with a session
# actually running on the machine that built them.
tempfile = "3"
# Read back by src/listener.rs's own tests, to check what actually landed on
# disk rather than trusting the in-memory value the call under test also has.
serde_json.workspace = true
# src/view.rs pins what the whole popup -- built from facts, then laid out --
# looks like, as the client crate does for the layout alone.
insta.workspace = true

# This workspace grows large test binaries and shares a target directory with
# other projects. Line tables are enough for a backtrace; full debug info is
# what fills the disk.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[patch.crates-io]
# See docs/quinn-pto-backoff.md. One field on TransportConfig, defaulted to
# quinn's own value; load-bearing until it is upstreamed.
quinn-proto = { path = "vendor/quinn-proto" }
