[workspace]
resolver = "3"
members = [
    "crates/oxutrm-proto",
    "crates/oxutrm-sync",
    "crates/oxutrm-term",
    "crates/oxutrm-net",
    "crates/oxutrm-host",
    "crates/oxutrm-client",
]

[workspace.package]
edition = "2024"
# alacritty_terminal 0.26 is edition 2024 with MSRV 1.85, so that floor applies
# to the whole build.
rust-version = "1.85"
license = "Apache-2.0"

# Declared once here, used by every member. Versions come from the interface
# contract's dependency table, which is normative:
#   docs/superpowers/plans/2026-08-25-oxutrm-contract.md
#
# `rustls` deliberately has NO entry: the contract pins it to "whatever quinn
# 0.11 re-exports", so oxutrm-net reaches it as `quinn::rustls` rather than
# declaring a version that could drift out of step with quinn's.
[workspace.dependencies]
quinn = "0.11"
rcgen = "0.13"
alacritty_terminal = { version = "0.26", default-features = false }
rustix = { version = "1", features = ["process", "termios", "stdio", "fs"] }
rustix-openpty = "0.2"
stun_codec = "0.4"
stunclient = "0.4"
bytecodec = "0.5"
crab_nat = "0.8"
igd-next = "0.17"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "macros",
    "io-util",
    "sync",
    "process",
    # SIGWINCH, for the client's event loop. `process` does NOT imply this:
    # both pull in `signal-hook-registry`, which is what makes the omission
    # look harmless, but only `signal` builds `tokio::signal`. Without it the
    # client would be back to asking the terminal its size 250 times a second
    # for an answer that changes twice a day.
    "signal",
] }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
# The `serde` feature is required: `Attrs` derives Serialize/Deserialize
# inside the bitflags! macro, which needs the generated internal type to
# implement them.
bitflags = { version = "2", features = ["serde"] }
anyhow = "1"
thiserror = "2"
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
sha1 = "0.10"
netdev = "0.46"
base64 = "0.22"
unicode-width = "0.2"
# `serde` so `CellText` round-trips as a plain str, byte-identical to what a
# `String` would produce - which is what makes the alias swappable.
compact_str = { version = "0.10", features = ["serde"] }
proptest = "1"
insta = "1"

# Not in the contract's table; required by the M4 integration plan and declared
# here so its tasks do not each re-pin them.
bytes = "1"
libc = "0.2"

oxutrm-proto = { path = "crates/oxutrm-proto" }
oxutrm-sync = { path = "crates/oxutrm-sync" }
oxutrm-term = { path = "crates/oxutrm-term" }
oxutrm-net = { path = "crates/oxutrm-net" }
oxutrm-host = { path = "crates/oxutrm-host" }
oxutrm-client = { path = "crates/oxutrm-client" }

[package]
name = "oxutrm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A remote terminal that survives bad networks, changing IP addresses, and NAT on both ends"

[[bin]]
name = "oxutrm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
oxutrm-proto.workspace = true
oxutrm-sync.workspace = true
oxutrm-term.workspace = true
oxutrm-net.workspace = true
oxutrm-host.workspace = true
oxutrm-client.workspace = true
# `fs` and `event` are for the keyboard: it is opened as its own file
# description on the controlling terminal rather than by making fd 0
# non-blocking, because fd 0's description belongs to the user's shell. `pty`
# is used only by the tests, which need a real terminal to observe that.
# The terminal itself belongs to oxutrm-client's RawGuard.
# `time` is for one test only, and it is load-bearing: the ladder's
# closed-update-channel guard has to measure CPU, not wall clock. A select that
# spins on a ready-but-empty channel still finishes on schedule -- it just eats
# a core doing it -- so an elapsed-time assertion cannot see the bug at all.
# Measured, not theorised: the naive wall-clock version passed against a
# deliberately reintroduced spin.
rustix = { workspace = true, features = ["event", "pty", "time"] }
# src/link.rs adapts a Frame onto a QUIC connection - datagram if it fits, a
# fresh unidirectional stream if not. It lives here rather than in oxutrm-net
# because it is transport POLICY for the session loops, not connectivity, and
# because oxutrm-net has no business knowing what a Frame is.
quinn.workspace = true

[dev-dependencies]
# `test-util` for `#[tokio::test(start_paused = true)]`, which src/accept.rs
# needs: the accept deadline is measured in tens of seconds and a test that
# waited for it in wall clock would be the slowest thing in the gate. Paused
# time makes the clock jump to the next deadline whenever the runtime has
# nothing to run, so the assertion is on the SAME const the code uses and costs
# no seconds. Under resolver 3 a dev-dependency feature is not unified into the
# normal build, so `test-util` never reaches the shipped binary.
tokio = { workspace = true, features = ["test-util"] }
# The loopback test replays the ANSI the renderer emitted through a real
# emulator and compares it with the host's screen. That is a stronger claim
# than "the two states match", which the sync tests already prove.
alacritty_terminal.workspace = true

# This workspace grows large test binaries and shares a target directory with
# other projects. Line tables are enough for a backtrace; full debug info is
# what fills the disk.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
