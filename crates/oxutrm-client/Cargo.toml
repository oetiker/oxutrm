[package]
name = "oxutrm-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "oxutrm local half: rendering, input and the terminal guard"

# NO alacritty_terminal. This crate renders a ScreenState; it does not emulate.
# Adding the emulator here would also drag a PTY, `polling` and `signal-hook`
# into the client for no reason. Phase C's speculative echo will revisit that.
[dependencies]
# `pty` is used only by the RawGuard tests, which need a real terminal: a test
# binary has no controlling terminal, so the restore path could not otherwise
# be exercised at all.
rustix = { workspace = true, features = ["pty"] }
# Only for `sigaction` in `RawGuard`. rustix exposes no stable way to install a
# signal handler (`rustix::runtime` is explicitly unstable), and a terminal left
# in raw mode by `kill <pid>` is not a thing to leave unhandled for want of a
# binding. Nothing else in this crate touches libc.
libc.workspace = true
anyhow.workspace = true
oxutrm-proto.workspace = true
