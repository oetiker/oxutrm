[package]
name = "oxutrm-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "oxutrm remote half: session registry, daemonizing and PTY supervision"

# Deliberately narrow. The registry and `daemonize` need the wire vocabulary
# and libc and nothing else, so this crate does not ride on oxutrm-term,
# oxutrm-sync or oxutrm-net while those are still being written. The later
# milestones that supervise a PTY and speak QUIC add them back when they are
# actually used; an unused dependency here would only couple this crate's
# build to work it does not depend on.
[dependencies]
anyhow.workspace = true
# `param` is added on top of the workspace feature set for
# `clock_ticks_per_second`, which turns /proc's clock ticks into seconds.
rustix = { workspace = true, features = ["param"] }
# Only `daemonize` uses this, for `fork` — which rustix cannot wrap safely,
# because what is sound after a fork depends on what the process was doing
# before it.
libc.workspace = true
oxutrm-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The signalling channel is a pair of pipes on a child `ssh`, and the attach
# path is a Unix socket, so both are async.
tokio.workspace = true
# The PSK is 32 bytes from the OS CSPRNG, fresh per attach, and travels
# base64-encoded in HostHello.
rand.workspace = true
base64.workspace = true

[dev-dependencies]
# Declared here rather than in [workspace.dependencies] so that adding it does
# not touch the root manifest, which other crates are being written against.
tempfile = "3"

# A test fixture, not part of the product: it daemonizes and then reports what
# survived, so tests/daemonize.rs can assert against a real detached process
# rather than a mock.
[[bin]]
name = "oxutrm-daemon-probe"
path = "src/bin/oxutrm-daemon-probe.rs"

# A stand-in for `ssh`, so the bootstrap can be tested without a server. It
# emits a banner and a motd before its first Signal, because real SSH does and
# a quiet local sshd would never catch a wrapper that cannot skip them.
[[bin]]
name = "oxutrm-fake-ssh"
path = "src/bin/oxutrm-fake-ssh.rs"
