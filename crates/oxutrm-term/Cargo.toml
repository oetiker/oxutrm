[package]
name = "oxutrm-term"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "oxutrm terminal emulation, PTY supervision and screen state"

[dependencies]
alacritty_terminal.workspace = true
rustix.workspace = true
rustix-openpty.workspace = true
serde.workspace = true
unicode-width.workspace = true
anyhow.workspace = true
# The screen model - ScreenState, Cell, Color, Attrs, Cursor, Modes - lives in
# oxutrm-proto, not here. It is a wire type, and keeping it out of this crate is
# what stops alacritty_terminal's PTY, polling and signal-hook from reaching
# oxutrm-sync, which must have no I/O in its dependency tree at all.
oxutrm-proto.workspace = true

[dev-dependencies]
insta.workspace = true
